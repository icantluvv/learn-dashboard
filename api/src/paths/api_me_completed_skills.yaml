get:
  summary: Get completed skills grouped by core for the current user
  operationId: getCompletedSkillsByCore
  tags:
    - Me
  security:
    - auth_cookie: []
  responses:
    "200":
      description: Success
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required: [core, coreName, skills]
              properties:
                core:
                  $ref: ../components/schemas/Core.yaml#/properties/type
                coreName:
                  type: string
                skills:
                  type: array
                  items:
                    type: object
                    required: [id, title]
                    properties:
                      id:
                        type: string
                      title:
                        type: string
    "401":
      description: Not authenticated
