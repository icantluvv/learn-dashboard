type: object
required:
  - skillsCount
  - topicsCount
  - questionsCount
properties:
  skillsCount:
    type: integer
    minimum: 0
    example: 97
  topicsCount:
    type: integer
    minimum: 0
    example: 13
  questionsCount:
    type: integer
    minimum: 0
    example: 1619
  completedSkillsCount:
    type: integer
    minimum: 0
    description: Present only when the request is made by an authenticated user.
    example: 12
