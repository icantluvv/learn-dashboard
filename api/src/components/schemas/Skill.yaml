type: object
required:
  - title
  - questions
  - core
properties:
  title:
    type: string
    example: "Замыкания в JavaScript"
  questions:
    type: array
    items:
      type: string
    example:
      - "Что такое замыкание?"
      - "Как замыкания используются для мемоизации?"
  completed:
    type: boolean
    description: >-
      Completion mark of the current user. Present only when the request is made by an
      authenticated user.
    example: false
  core:
    type: string
    enum:
      - frontend
      - backend
      - devops
      - design
    example: frontend
